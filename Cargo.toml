[package]
name = "wavpack-rs"
version = "0.1.0"
edition = "2024"
description = "Pure Rust decoder for WavPack lossless audio files"
license = "MIT"
repository = "https://github.com/lexicone42/wavpack-rs"
keywords = ["audio", "wavpack", "lossless", "decoder"]
categories = ["multimedia::audio", "encoding"]

# Signal processing code uses wrapping i32/u32 arithmetic
[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false

[features]
trace = []

# Zero dependencies — pure Rust
